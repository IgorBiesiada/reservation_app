{% extends 'base.html' %}
{% load static %}

{% block title %} List {% endblock %}

{%block container %}

{% for r in resources %}
<div class="card mb-3">
  {% if product.images.first %}
      <img src="/media/{{ product.images.first }}"  class="card-img-top" alt="{{ product.name }}">
  {% else %}
      <img src="{% static 'images/no_img.png' %}"  class="card-img-top" alt="{{ product.name }}">
  {% endif %}
  <div class="card-body">
    <h5 class="card-title">{{r.name}}</h5>
    <p class="card-text">{{r.price_per_hour}}</p>
    <p class="card-text"><small class="text-body-secondary">{{r.updated_at}}</small></p>
    <a href="#" class="btn btn-primary">Szczegóły</a>
    <a href="{% url 'rooms:delete' r.pk %}" class="btn btn-primary">Usuń</a>
  </div>
</div>
{% endfor %}
{% endblock %}
