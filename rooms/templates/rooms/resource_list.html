{% extends 'base.html' %}
{% load static %}

{% block title %} List {% endblock %}

{% for r in resource %}

<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="..." class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{ resource.title}}</h5>
        <p class="card-text">{{ resource.price_per_hour}}</p>
        <p class="card-text"><small class="text-body-secondary">{{resource.updated_at}}</small></p>
      </div>
    </div>
  </div>
</div>

{% endif %}
