{% extends 'base.html' %}
{% load static %}

{% block title %} List {% endblock %}

{%block container %}

{% for r in resources %}
<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="..." class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{ r.title}}</h5>
        <p class="card-text">{{ r.price_per_hour}}</p>
        <p class="card-text"><small class="text-body-secondary">{{r.updated_at}}</small></p>
      </div>
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
